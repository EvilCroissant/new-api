name: Sync upstream

on:
  schedule:
    # GitHub cron uses UTC: 00:00/12:00 UTC = 08:00/20:00 Asia/Shanghai.
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream main
        env:
          UPSTREAM_REPOSITORY: QuantumNous/new-api
        run: |
          fork_main_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main is already up to date with upstream/main"
          else
            if ! git merge --no-commit --no-ff upstream/main; then
              non_workflow_conflicts="$(
                git diff --name-only --diff-filter=U |
                  grep -v '^\.github/workflows/' || true
              )"
              if [ -n "${non_workflow_conflicts}" ]; then
                git merge --abort
                echo "::error::upstream/main conflicts outside .github/workflows"
                echo "${non_workflow_conflicts}"
                exit 1
              fi
            fi

            # Workflow conflicts are resolved by keeping the fork-owned set.
            # The default GITHUB_TOKEN cannot push workflow-file changes.
            git rm --recursive --force --ignore-unmatch .github/workflows
            git restore --source="${fork_main_sha}" --staged --worktree -- .github/workflows
            remaining_conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -n "${remaining_conflicts}" ]; then
              git merge --abort
              echo "::error::unresolved conflicts remain after preserving fork workflows"
              echo "${remaining_conflicts}"
              exit 1
            fi

            git commit --no-edit
            git push origin HEAD:main
          fi

      - name: Disable inherited workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_ids="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
              --jq '.workflows[] | select(
                .path != ".github/workflows/sync-upstream.yml" and
                .path != ".github/workflows/docker-build.yml" and
                .path != ".github/workflows/docker-image-branch.yml" and
                .state == "active"
              ) | .id'
          )"

          while IFS= read -r workflow_id; do
            if [ -n "${workflow_id}" ]; then
              gh api --method PUT \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable"
            fi
          done <<< "${workflow_ids}"

  sync-develop:
    needs: sync
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: develop

      - name: Merge fork main into develop
        run: |
          fork_develop_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Develop is already up to date with origin/main"
          else
            if ! git merge --no-commit --no-ff origin/main; then
              non_workflow_conflicts="$(
                git diff --name-only --diff-filter=U |
                  grep -v '^\.github/workflows/' || true
              )"
              if [ -n "${non_workflow_conflicts}" ]; then
                git merge --abort
                echo "::error::origin/main conflicts with develop outside .github/workflows"
                echo "${non_workflow_conflicts}"
                exit 1
              fi
            fi

            # Workflow conflicts are resolved by keeping develop's fork-owned set.
            git rm --recursive --force --ignore-unmatch .github/workflows
            git restore --source="${fork_develop_sha}" --staged --worktree -- .github/workflows
            remaining_conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -n "${remaining_conflicts}" ]; then
              git merge --abort
              echo "::error::unresolved conflicts remain after preserving develop workflows"
              echo "${remaining_conflicts}"
              exit 1
            fi

            git commit --no-edit
            git push origin HEAD:develop
          fi
