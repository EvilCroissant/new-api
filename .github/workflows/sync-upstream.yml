name: Sync upstream

on:
  schedule:
    # GitHub cron uses UTC: 00:00/12:00 UTC = 08:00/20:00 Asia/Shanghai.
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream main
        env:
          UPSTREAM_REPOSITORY: QuantumNous/new-api
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin HEAD:main

      - name: Disable inherited workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_ids="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
              --jq '.workflows[] | select(.path != ".github/workflows/sync-upstream.yml" and .state == "active") | .id'
          )"

          while IFS= read -r workflow_id; do
            if [ -n "${workflow_id}" ]; then
              gh api --method PUT \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable"
            fi
          done <<< "${workflow_ids}"

  sync-develop:
    needs: sync
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: develop

      - name: Merge fork main into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop

          if ! git merge --no-edit origin/main; then
            git merge --abort
            echo "::error::origin/main conflicts with develop; resolve the conflict manually"
            exit 1
          fi

          git push origin HEAD:develop
